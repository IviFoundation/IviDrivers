# .azure/Scanning.yml

parameters:
- name: PackageVersion
  type: string
- name: DependsOn
  type: string
  default: 'stage_build'

stages:
- stage: stage_sbom_spdx
  displayName: 'Generate Security Reports (SBOM + Scorecard)'
  dependsOn:
    - ${{ parameters.DependsOn }}
  condition: succeeded()
  variables:
    PackageVersion: ${{ parameters.PackageVersion }}

  jobs:
  - job: job_sbom_spdx
    displayName: 'Generate Syft SBOM + OpenSSF Scorecard'
    pool:
      vmImage: 'windows-2022'

    steps:
      - checkout: self

      - task: DownloadPipelineArtifact@2
        displayName: 'Download drop artifact'
        inputs:
          artifactName: 'drop'
          targetPath: '$(Pipeline.Workspace)/drop'

      # ------------------------
      # Syft – SBOM generation
      # ------------------------
      - task: PowerShell@2
        displayName: 'Install Syft (Choco/Scoop)'
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'
            if (-not (Get-Command syft -ErrorAction SilentlyContinue)) {
              if (Get-Command choco -ErrorAction SilentlyContinue) {
                choco install syft -y
              } else {
                iex "& {$(irm get.scoop.sh)}"
                scoop install syft
              }
            }
            syft version

      - task: PowerShell@2
        displayName: 'Extract NuGet packages from drop/Packages'
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'

            $pkgRoot     = "$(Pipeline.Workspace)\drop\Packages"
            $extractRoot = "$(Pipeline.Workspace)\sbom_work"

            New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null

            Get-ChildItem $pkgRoot -Filter *.nupkg | ForEach-Object {
              $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
              $dest = Join-Path $extractRoot $name
              New-Item -ItemType Directory -Force -Path $dest | Out-Null

              Write-Host "Extracting $($_.FullName) -> $dest"
              tar -xf $_.FullName -C $dest
            }

      - task: PowerShell@2
        displayName: 'Generate Syft SPDX SBOM for IviFoundation.DriverCore'
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'

            $extractRoot = "$(Pipeline.Workspace)\sbom_work"
            $reportsRoot = "$(Build.ArtifactStagingDirectory)\reports"
            $version     = "$(PackageVersion)"

            New-Item -ItemType Directory -Force -Path $reportsRoot | Out-Null

            $driverCoreFound = $false

            Get-ChildItem $extractRoot -Directory | ForEach-Object {
              $name = $_.Name   # e.g. IviFoundation.DriverCore.1.0.1 OR Acme.AcmeDriver...

              if ($name -like 'IviFoundation.DriverCore*') {
                $sbomFile = Join-Path $reportsRoot ("Syft_IviFoundation.DriverCore_" + $version + "_spdx.json")

                Write-Host "Generating Syft SBOM for $name -> $sbomFile"
                syft dir:"$($_.FullName)" -o "spdx-json=$sbomFile"

                if ($LASTEXITCODE -ne 0) {
                  throw "Syft SBOM generation failed for $name (exit $LASTEXITCODE)"
                }

                $driverCoreFound = $true
              }
              else {
                Write-Host "Skipping non-DriverCore package: $name"
              }
            }

            if (-not $driverCoreFound) {
              throw "No IviFoundation.DriverCore* package found under $extractRoot – cannot generate SBOM."
            }

      # ------------------------
      # OpenSSF Scorecard
      # ------------------------
      - task: PowerShell@2
        displayName: 'Download OpenSSF Scorecard (Windows tar.gz)'
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'

            $version  = '5.4.0'
            $workDir  = "$(Build.SourcesDirectory)\scorecard"
            $archive  = Join-Path $workDir "scorecard_${version}_windows_amd64.tar.gz"
            $exePath  = Join-Path $workDir "scorecard.exe"

            New-Item -ItemType Directory -Force -Path $workDir | Out-Null

            if (!(Test-Path $exePath)) {
              $url = "https://github.com/ossf/scorecard/releases/download/v$version/scorecard_${version}_windows_amd64.tar.gz"
              Write-Host "Downloading Scorecard from $url"
              Invoke-WebRequest -Uri $url -OutFile $archive

              Write-Host "Extracting Scorecard archive to $workDir"
              tar -xf $archive -C $workDir

              $exe = Get-ChildItem $workDir -Recurse -File |
                     Where-Object { $_.Name -like 'scorecard*' } |
                     Select-Object -First 1

              if (-not $exe) {
                throw "Could not find scorecard binary under $workDir after extraction."
              }

              Write-Host "Found extracted scorecard binary at: $($exe.FullName)"

              if ($exe.FullName -ne $exePath) {
                Copy-Item $exe.FullName $exePath -Force
              } else {
                Write-Host "scorecard.exe already at desired path; skipping copy."
              }
            }
            else {
              Write-Host "Scorecard already present at $exePath"
            }

            Write-Host "Scorecard located at: $exePath"
            & $exePath version

      - task: PowerShell@2
        displayName: 'Run OpenSSF Scorecard in local mode (no GitHub token)'
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'

            $exePath     = "$(Build.SourcesDirectory)\scorecard\scorecard.exe"
            $reportsRoot = "$(Build.ArtifactStagingDirectory)\reports"
            $version     = "$(PackageVersion)"
            $sourceDir   = "$(Build.SourcesDirectory)"

            if (!(Test-Path $exePath)) {
              throw "scorecard.exe not found at $exePath"
            }

            New-Item -ItemType Directory -Force -Path $reportsRoot | Out-Null

            Write-Host "Running Scorecard in local mode on: $sourceDir"

            $outFile = Join-Path $reportsRoot ("Scorecard_IviFoundation_" + $version + ".json")

            #  No --repo here, so no GitHub API, no rate limits, no token required
            & $exePath --local="$sourceDir" --show-details --format=json > $outFile

            if ($LASTEXITCODE -ne 0) {
              throw "Scorecard failed with exit code $LASTEXITCODE"
            }

            Write-Host "Scorecard report generated: $outFile"

      - task: PowerShell@2
        displayName: 'Format JSON reports'
        inputs:
          targetType: 'inline'
          script: |
            $dir = "$(Build.ArtifactStagingDirectory)\reports"

            Get-ChildItem $dir -Filter *.json -Recurse | ForEach-Object {
              Write-Host "Formatting $($_.Name)"

              # Step 1: normalize encoding to UTF-8 (no BOM)
              $content = Get-Content $_.FullName -Raw
              $content | Set-Content $_.FullName -Encoding utf8

              # Step 2: jq pretty-print (human readable)
              jq --indent 2 '.' $_.FullName |
                Set-Content $_.FullName -Encoding utf8
            }

      - task: PublishPipelineArtifact@1
        displayName: 'Publish security reports (Syft + Scorecard)'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)\reports'
          artifactName: 'reports'
